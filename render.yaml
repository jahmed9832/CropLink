services:
  - type: web
    name: agrisphere-backend
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python -m app.ml.train_all
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: agrisphere
      - key: API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_REQUIRED
        value: "true"
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
